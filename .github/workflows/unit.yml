name: Unit Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  unit-test:
    name: Unit Tests (${{ matrix.platform }})
    timeout-minutes: 30
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/viamrobotics/cpp-sdk-conan-ubuntu:focal
      options: --platform ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: github-linux-arm64-8core
            platform: linux/arm64
          - runner: ubuntu-latest
            platform: linux/amd64
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Show conan profile
        run: conan profile show

      - name: Export host gstreamer recipe
        run: conan export etc/conan/gstreamer

      - name: Install Conan dependencies
        run: >
          conan install . -o "&:with_tests=True" --build=missing
          -c tools.system.package_manager:mode=install

      # Test-mode pipeline: videotestsrc ! videoconvert ! jpegenc ! appsink
      - name: Install gstreamer runtime plugins
        run: apt-get update && apt-get install -y --no-install-recommends gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - name: Build and run tests
        env:
          VIAM_CSI_DEVICE: jetson
          VIAM_CSI_TEST_MODE: "1"
        run: |
          cmake --preset conan-release
          cmake --build --preset conan-release
          ctest --test-dir build/Release --output-on-failure
