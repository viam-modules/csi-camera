name: Unit Tests

on:
  push:
    branches:
      - '*'
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  pull_request:
    branches:
      - '*'
    paths-ignore:
      - 'README.md'
      - 'docs/**'

jobs:
  integration-test:
    name: Unit Tests
    runs-on: buildjet-2vcpu-ubuntu-2204-arm
    strategy:
      matrix:
        include:
          - container: ghcr.io/viam-modules/csi-camera/viam-cpp-base-pi:0.0.6
            TARGET: pi
    container:
      image: ${{ matrix.container }}
      options: --platform linux/arm64

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Install module dependencies
        run: make dep

      - name: Build viam-csi binary
        run: make build

      - name: Extract AppImage
        run: |
          cd ./etc
          ./*.AppImage --appimage-extract
          chmod +x squashfs-root/AppRun

      - name: Run unit tests
        run: |
          cd tests/unit
          export VIAM_CSI_DEVICE=${{ matrix.TARGET }}
          export VIAM_CSI_TEST_MODE=1
          ctest --test-dir build --rerun-failed --output-on-failure -VV
