name: Unit Tests

on:
  push:
    branches:
      - '*'
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  pull_request:
    branches:
      - '*'
    paths-ignore:
      - 'README.md'
      - 'docs/**'

jobs:
  unit-test:
    name: Unit Tests
    runs-on: buildjet-8vcpu-ubuntu-2204-arm
    strategy:
      matrix:
        include:
          - container: ghcr.io/viam-modules/csi-camera/viam-cpp-base-jetson:0.0.6
            TARGET: jetson

    container:
      image: ${{ matrix.container }}
      options: --platform linux/arm64

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set environment variables
        run: |
          echo "TARGET=${{ matrix.TARGET }}" >> $GITHUB_ENV
          echo "META_PATH=${{ matrix.META_PATH }}" >> $GITHUB_ENV

      - name: Restore Conan cache
        uses: actions/cache@v4
        with:
          path: .conan-home
          key: ${{ runner.os }}-jetson-conan-${{ hashFiles('conanfile.py', 'Makefile') }}
          restore-keys: |
            ${{ runner.os }}-jetson-conan-

      - name: Install module dependencies
        run: make dep

      - name: Build and run unit tests
        run: make conan-test TARGET=${{ matrix.TARGET }}
        env:
          VIAM_CSI_DEVICE: ${{ matrix.TARGET }}
          VIAM_CSI_TEST_MODE: "1"
