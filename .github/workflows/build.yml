name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }} module.tar.gz
    runs-on: github-linux-arm64-8core
    # focal has the lowest glibc (2.31) of the cpp-sdk-conan images, so one
    # binary runs on JetPack 5/6 and Raspberry Pi OS bullseye and newer.
    container:
      image: ghcr.io/viamrobotics/cpp-sdk-conan-ubuntu:focal
      options: --platform linux/arm64
    strategy:
      fail-fast: false
      matrix:
        # Same binary; only the packaged meta.json differs.
        target: [jetson, pi]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build
        run: TARGET=${{ matrix.target }} ./bin/build.sh

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: module-${{ matrix.target }}
          path: module.tar.gz
          retention-days: 7

  upload:
    name: Upload modules to registry
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: jetson
            meta-path: meta.json
          - target: pi
            meta-path: meta-pi.json
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download module artifact
        uses: actions/download-artifact@v4
        with:
          name: module-${{ matrix.target }}
          path: ./artifacts/${{ matrix.target }}/

      - name: Upload module to registry
        uses: viamrobotics/upload-module@main
        with:
          meta-path: ${{ matrix.meta-path }}
          module-path: ./artifacts/${{ matrix.target }}/module.tar.gz
          platform: linux/arm64
          version: ${{ github.ref_name }}
          key-id: ${{ secrets.viam_key_id }}
          key-value: ${{ secrets.viam_key_value }}
